name: Docs Check

# apps/docs is deliberately outside the Turbo pipeline (no build/lint/
# check-types scripts), so pr-check.yml runs nothing against it even though
# its paths filter matches apps/**. This checks the one thing that can break
# a docs deploy: a link or a navigation entry pointing at a page that is not
# there.
on:
  pull_request:
    branches:
      - staging
      - main
    paths:
      - "apps/docs/**"

jobs:
  links:
    name: Broken links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install

      - name: Check for broken links
        working-directory: apps/docs
        run: bun run check-links
