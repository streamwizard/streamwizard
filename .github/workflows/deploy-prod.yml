name: Deploy to Production

on:
  workflow_run:
    workflows: ["Build Check", "Deploy Production Database Migrations"]
    types:
      - completed
    branches:
      - main

permissions: {}

# Both upstream workflows trigger this one; run them one at a time so two
# green completions can't race to open or merge the same deploy PR.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # Only promote runs that came from this repo's own main: a push, or a
    # manual dispatch (which needs write access). A run from a fork can carry
    # head_branch "main" too, so the branches filter above is not enough.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    steps:
      # This job runs once per completed upstream workflow. Merge only when the
      # latest completed run of *both* upstreams on main is green, so app code
      # never ships on top of a failed database migration. If the other
      # upstream is still running, this run ends early and its completion
      # triggers a fresh evaluation.
      - name: Require Build Check and DB migrations both green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready=true
          for wf in build-check.yml deploy-prod-db.yml; do
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --limit 20 \
              --json status,conclusion,event \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0] | select(.status == "completed") | .conclusion')
            echo "$wf: ${conclusion:-not completed}"
            [ "$conclusion" = "success" ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      # production is protected by a ruleset: changes only through a merge-
      # commit PR, which the repo owner may merge without review. The Actions
      # token can do neither, so the PR is opened and merged with the owner's
      # fine-grained token (PROD_DEPLOY_TOKEN: this repo only, contents +
      # pull requests read/write).
      - name: Merge main into production through a PR
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROD_DEPLOY_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PROD_DEPLOY_TOKEN secret is not set"
            exit 1
          fi

          # Ship only the commit the upstream run verified. If main has moved
          # on, the newer commit's own runs will trigger the deploy.
          main_sha=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          if [ "$main_sha" != "$SHA" ]; then
            echo "main is at ${main_sha:0:8}, not the verified ${SHA:0:8}; leaving it to the newer run"
            exit 0
          fi

          ahead=$(gh api "repos/$REPO/compare/production...main" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "production already contains main, nothing to deploy"
            exit 0
          fi

          pr=$(gh pr list --repo "$REPO" --base production --head main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create --repo "$REPO" --base production --head main \
              --title "Deploy: main → production" \
              --body "Automated deploy after Build Check and production database migrations passed on main (\`${SHA:0:8}\`).")
            pr=${url##*/}
          fi

          # Merge commit only: a squash would make production diverge from main.
          # GitHub computes mergeability a moment after the PR opens, so an
          # immediate merge can be refused once; retry briefly.
          # --match-head-commit refuses the merge if main moved after the check.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$pr" --repo "$REPO" --merge --admin --match-head-commit "$SHA"; then
              echo "merged #$pr into production"
              exit 0
            fi
            sleep 10
          done
          echo "::error::could not merge #$pr into production"
          exit 1
