const SPEED_CAP = 1.4;                        // m/s at top of ramp (~5 km/h)
const STREAM_COLOUR = { 1: "#d99b16", 2: "#14a08d" };
const STREAM_NAME   = { 1: "no stream_id", 2: "318196374886" };

const map = L.map("map", { preferCanvas: true });
// Carto basemap: OSM's own tiles block file:// pages (no Referer header sent)
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  maxZoom: 20,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * Math.min(1, Math.max(0, k))));
const SLOW = [61, 74, 151], MID = [20, 160, 141], FAST = [217, 155, 22];
function ramp(f) {
  const c = f < 0.55 ? mix(SLOW, MID, f / 0.55) : mix(MID, FAST, (f - 0.55) / 0.45);
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const clock = (t) => new Date(t * 1000).toISOString().slice(11, 19);
const layer = L.layerGroup().addTo(map);
let mode = "speed";

function render() {
  layer.clearLayers();
  for (let i = 1; i < PTS.length; i++) {
    const a = PTS[i - 1], b = PTS[i];
    const gap = b[2] - a[2] > 60;             // recording gap: not walked ground
    L.polyline([[a[0], a[1]], [b[0], b[1]]], {
      color: mode === "speed" ? ramp(((a[3] + b[3]) / 2) / SPEED_CAP) : STREAM_COLOUR[b[4]],
      weight: gap ? 2 : 4,
      opacity: gap ? 0.35 : 0.9,
      dashArray: gap ? "5,6" : null,
      interactive: false
    }).addTo(layer);
  }

  // one invisible hit target per fix, so hovering anywhere on the trace reads out
  for (const p of PTS) {
    L.circleMarker([p[0], p[1]], { radius: 6, opacity: 0, fillOpacity: 0 })
      .bindTooltip(
        `${clock(p[2])} UTC<br>${(p[3] * 3.6).toFixed(1)} km/h<br>${STREAM_NAME[p[4]]}`,
        { className: "fix", direction: "top" }
      )
      .addTo(layer);
  }

  const ends = [[PTS[0], "Start 14:58:31"], [PTS[PTS.length - 1], "End 16:06:47"]];
  for (const [p, label] of ends) {
    L.circleMarker([p[0], p[1]], {
      radius: 6, color: "#101619", weight: 2, fillColor: "#fff", fillOpacity: 1
    }).bindTooltip(label, { permanent: true, direction: "right", className: "fix" }).addTo(layer);
  }
}

render();
map.fitBounds(L.latLngBounds(PTS.map((p) => [p[0], p[1]])).pad(0.05));
L.control.scale({ imperial: false }).addTo(map);

document.querySelectorAll('input[name="mode"]').forEach((r) =>
  r.addEventListener("change", () => { mode = r.value; render(); })
);
</script>
