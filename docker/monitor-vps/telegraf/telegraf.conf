# Telegraf — Supabase platform metrics → InfluxDB.
#
# Supabase exposes a Prometheus endpoint per project at
#   https://<project-ref>.supabase.co/customer/v1/privileged/metrics
# authenticated with HTTP Basic (username "service_role", password = the
# project's service-role/secret key). The endpoint concatenates several
# exporters with duplicate HELP/TYPE lines, which inputs.prometheus rejects —
# so scraping goes through scrape-supabase.sh (wget + dedupe) via inputs.exec.
#
# Each input tags its points with the InfluxDB bucket for that environment;
# the single output routes on that tag, so prod metrics land next to prod app
# metrics and staging next to staging. The prometheus parser writes everything
# into one measurement named "prometheus" with the metric name as the field
# key (node_cpu_seconds_total=...) — M9's supabase-platform queries and alert
# rules 25–28 filter on _field, not _measurement.

[agent]
  interval = "60s"
  round_interval = true
  flush_interval = "30s"
  omit_hostname = true

# ── Inputs ──────────────────────────────────────────────────────────────────

[[inputs.exec]]
  commands = ["/etc/telegraf/scrape-supabase.sh ${SUPABASE_METRICS_URL_PROD} ${SB_SECRET_KEY_PROD}"]
  data_format = "prometheus"
  timeout = "30s"
  # The endpoint exposes hundreds of series; keep only what the dashboard and
  # alert rules use (db CPU, memory, disk, load, connections, cache hit, db
  # size, pgbouncer). Widen when M9 needs more.
  fieldinclude = [
    "node_cpu_seconds_total",
    "node_load*",
    "node_memory_*",
    "node_filesystem_*",
    "pg_up",
    "max_connections_connection_count",
    "connection_stats_*",
    "direct_connection_stats_*",
    "pg_stat_database*",
    "pg_database_size*",
    "pg_stat_statements_total_queries",
    "pg_stat_statements_total_time_seconds",
    "http_server_request_duration_seconds_count",
    "http_server_request_duration_seconds_sum",
    "pgbouncer_*",
  ]
  [inputs.exec.tags]
    influx_bucket = "${INFLUX_BUCKET_PROD}"

[[inputs.exec]]
  commands = ["/etc/telegraf/scrape-supabase.sh ${SUPABASE_METRICS_URL_STAGING} ${SB_SECRET_KEY_STAGING}"]
  data_format = "prometheus"
  timeout = "30s"
  fieldinclude = [
    "node_cpu_seconds_total",
    "node_load*",
    "node_memory_*",
    "node_filesystem_*",
    "pg_up",
    "max_connections_connection_count",
    "connection_stats_*",
    "direct_connection_stats_*",
    "pg_stat_database*",
    "pg_database_size*",
    "pg_stat_statements_total_queries",
    "pg_stat_statements_total_time_seconds",
    "http_server_request_duration_seconds_count",
    "http_server_request_duration_seconds_sum",
    "pgbouncer_*",
  ]
  [inputs.exec.tags]
    influx_bucket = "${INFLUX_BUCKET_STAGING}"

# ── Output ──────────────────────────────────────────────────────────────────

[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket_tag = "influx_bucket"
  exclude_bucket_tag = true
