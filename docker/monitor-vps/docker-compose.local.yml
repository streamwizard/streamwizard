# Local smoke test — run the alert stack against local Supabase and the dev
# Influx bucket, without Doppler. Never auto-merged (not named "override");
# the VPS always runs the base file alone.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#     --env-file <env file> up --build -d web-admin alert-worker
#
# ALERT_ENV=dev keeps the engine's home env "dev", which routes every alert
# to alert_events only — a local run never messages Discord/Telegram.
# Caddy is deliberately not started (needs real DNS for its certificate).

services:
  web-admin:
    build:
      args:
        DOPPLER_TOKEN: ""
        # Baked into the bundles at build time (NEXT_PUBLIC_ derivation).
        SUPABASE_URL: http://host.docker.internal:54321
        SUPABASE_PUBLIC_KEY: ${SUPABASE_PUBLIC_KEY}
    # Skip `doppler run --`; env comes straight from this file.
    entrypoint: ["bun", "apps/web-admin/server.js"]
    ports:
      - "3005:3000"
    environment:
      DOPPLER_TOKEN: ""
      NODE_ENV: development
      # Next standalone hard-sets NODE_ENV=production; this keeps the alert
      # engine in dev (alert_events only, no Discord/Telegram).
      ALERT_ENV: dev
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-streamwizard-dev}
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_PUBLIC_KEY: ${SUPABASE_PUBLIC_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alert-worker:
    # Skip `doppler run --`; env comes straight from this file.
    entrypoint: ["bun", "run", "start"]
    environment:
      DOPPLER_TOKEN: ""
      NODE_ENV: development
      ALERT_ENV: dev
      INFLUXDB_URL: ${INFLUXDB_URL}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-streamwizard-dev}
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      TICK_SECONDS: "15"
    extra_hosts:
      - "host.docker.internal:host-gateway"
